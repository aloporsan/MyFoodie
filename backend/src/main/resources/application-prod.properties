# Perfil de producción. Se activa con SPRING_PROFILES_ACTIVE=prod.

# En producción MONGODB_URI es obligatoria: sin default para fallar al arrancar
# si no está configurada, en vez de conectar por error a un Mongo local.
# (Spring Boot 4: la conexión se enlaza desde spring.mongodb.*)
spring.mongodb.uri=${MONGODB_URI}

# Logging
logging.level.root=WARN
logging.level.com.myfoodie=INFO

# No exponer detalles internos de errores al cliente
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never

# Redis NO está provisionado en producción. La blacklist de JWT en el logout
# degrada con gracia (try/catch en JwtAuthenticationFilter y PerfilService);
# aqui solo silenciamos el ruido de reconexion en los logs.
logging.level.io.lettuce.core=OFF
logging.level.org.springframework.data.redis=OFF
