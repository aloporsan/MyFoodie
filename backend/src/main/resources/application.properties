spring.application.name=myfoodie
spring.config.import=optional:file:.env.properties

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mongodb.uri=mongodb://localhost:27017/myfoodie
spring.data.mongodb.auto-index-creation=true

jwt.secret=myfoodie-super-secret-key-for-jwt-token-generation-replace-in-production
jwt.expiration=604800000

spring.web.error.include-message=always

spring.data.redis.host=localhost
spring.data.redis.port=6379

# MyFoodie
myfoodie.mail.from=onboarding@resend.dev
myfoodie.frontend.reset-password-url=myfoodie://reset-password
