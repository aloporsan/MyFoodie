spring.application.name=myfoodie
spring.config.import=optional:file:.env.properties

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# En Spring Boot 4 la cadena de conexion se enlaza desde spring.mongodb.* (no spring.data.mongodb.*)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/myfoodie}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:myfoodie-super-secret-key-for-jwt-token-generation-replace-in-production}
jwt.expiration=${JWT_EXPIRATION:604800000}

spring.web.error.include-message=always

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# MyFoodie
myfoodie.mail.from=onboarding@resend.dev
myfoodie.frontend.reset-password-url=myfoodie://reset-password
myfoodie.seed.password=${MYFOODIE_SEED_PASSWORD:MyFoodieSeed2026!}
