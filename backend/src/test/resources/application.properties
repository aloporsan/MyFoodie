# Flapdoodle gestiona la URI del MongoDB embebido automaticamente
# spring.mongodb.uri=mongodb://localhost:27017/myfoodie_test
de.flapdoodle.mongodb.embedded.version=8.0.0

jwt.secret=test-secret-key-for-jwt-at-least-32-chars-long
jwt.expiration=3600000

# Clave ficticia para que EmailService arranque sin fallar en tests
RESEND_API_KEY=test-dummy-key-not-used
myfoodie.mail.from=test@test.com
myfoodie.frontend.reset-password-url=myfoodie://reset-password
