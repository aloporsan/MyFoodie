name: CI — Frontend React Native

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Lint, TypeScript, tests y export de Expo
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache de node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Verificar tipos con TypeScript (sin emitir ficheros)
        run: npx tsc --noEmit

      - name: Ejecutar tests con Jest
        # --passWithNoTests permite que el CI pase cuando aún no hay ficheros de test
        run: npm test
        env:
          CI: true

      - name: Verificar que el export de Expo no falla
        # Exporta solo la plataforma web para evitar necesitar SDKs nativos en CI
        run: npx expo export --platform web
        env:
          # Suprimir la advertencia interactiva de Expo en entornos CI
          CI: true
