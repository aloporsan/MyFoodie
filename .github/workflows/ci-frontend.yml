name: CI — Frontend React Native

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Lint, TypeScript, tests y export de Expo
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache de node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependencias (npm ci)
        # --legacy-peer-deps necesario por conflicto entre jest-expo@56 y react@19.1
        run: npm ci --legacy-peer-deps

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Verificar tipos con TypeScript (sin emitir ficheros)
        run: npx tsc --noEmit

      - name: Ejecutar tests con Jest (con cobertura)
        run: npm run test:coverage -- --ci
        env:
          CI: true

      - name: Publicar cobertura del frontend como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          retention-days: 7

      - name: Verificar que el export de Expo no falla
        # Exporta solo la plataforma web para evitar necesitar SDKs nativos en CI
        run: npx expo export --platform web
        env:
          # Suprimir la advertencia interactiva de Expo en entornos CI
          CI: true
