name: CI — Backend Spring Boot

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  build:
    name: Compilar y testear backend
    runs-on: ubuntu-latest

    services:
      # MongoDB necesario para los tests de integración
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Ejecutar tests unitarios e integración (con cobertura JaCoCo)
        # El perfil "coverage" activa el agente de jacoco (desactivado por defecto
        # porque en local con poca RAM provoca compilaciones parciales)
        run: mvn test -Pcoverage --batch-mode
        env:
          # Apuntar al MongoDB del servicio de CI (Spring Boot 4: prefijo spring.mongodb.*)
          SPRING_MONGODB_URI: mongodb://localhost:27017/myfoodie_test
          # Clave ficticia para que el EmailService arranque sin fallar
          RESEND_API_KEY: ci-dummy-key-not-used-in-tests

      - name: Resumen de cobertura JaCoCo
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { im+=$4; ic+=$5; bm+=$6; bc+=$7 }
              END {
                printf "### Cobertura JaCoCo (backend)\n\n"
                printf "| Métrica | Cubierto | Total | %% |\n|---|---|---|---|\n"
                printf "| Instrucciones | %d | %d | %.1f%% |\n", ic, ic+im, 100*ic/(ic+im)
                printf "| Ramas | %d | %d | %.1f%% |\n", bc, bc+bm, 100*bc/(bc+bm)
              }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compilar artefacto JAR (sin ejecutar tests)
        run: mvn package -DskipTests --batch-mode

      - name: Publicar resultados de tests como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-tests-backend
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
